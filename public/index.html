<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>KDBot Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0d10;
      color: #ffffff;
      min-height: 100vh;
    }

    .header {
      height: 75px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 30px;
      background: #111419;
      border-bottom: 1px solid #242830;
    }

    .logo {
      font-size: 26px;
      font-weight: bold;
    }

    .logo span {
      color: #ff7a00;
    }

    .user-area {
      display: none;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
      background: #242830;
    }

    .username {
      font-weight: bold;
    }

    .logout {
      border: 0;
      background: #252a32;
      color: white;
      padding: 9px 14px;
      border-radius: 7px;
      cursor: pointer;
    }

    .logout:hover {
      background: #323842;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 35px 20px;
    }

    .hero {
      text-align: center;
      padding: 55px 20px;
    }

    .hero h1 {
      font-size: 42px;
      margin-bottom: 15px;
    }

    .hero h1 span {
      color: #ff7a00;
    }

    .hero p {
      color: #aeb4bf;
      font-size: 18px;
      margin-bottom: 30px;
    }

    .login {
      display: inline-block;
      padding: 14px 25px;
      background: #5865f2;
      color: white;
      text-decoration: none;
      border-radius: 9px;
      font-weight: bold;
    }

    .login:hover {
      opacity: 0.9;
    }

    .dashboard {
      display: none;
    }

    .welcome {
      background: #15181e;
      border: 1px solid #242830;
      border-radius: 14px;
      padding: 25px;
      margin-bottom: 20px;
    }

    .welcome h2 {
      margin-bottom: 8px;
    }

    .welcome p {
      color: #aeb4bf;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
    }

    .card {
      background: #15181e;
      border: 1px solid #242830;
      border-radius: 12px;
      padding: 25px;
    }

    .card h3 {
      color: #aeb4bf;
      font-size: 15px;
      margin-bottom: 12px;
    }

    .value {
      font-size: 25px;
      font-weight: bold;
    }

    .online {
      color: #43d17b;
    }

    .profile {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
    }

    .profile img {
      width: 70px;
      height: 70px;
      border-radius: 50%;
    }

    .profile h2 {
      margin-bottom: 5px;
    }

    .profile p {
      color: #8e96a3;
    }

    footer {
      text-align: center;
      color: #6f7682;
      padding: 40px 20px;
    }

    @media (max-width: 600px) {
      .header {
        padding: 0 15px;
      }

      .username {
        display: none;
      }

      .hero h1 {
        font-size: 32px;
      }

      .container {
        padding: 20px 15px;
      }
    }
  </style>
</head>

<body>

<header class="header">

  <div class="logo">
    <span>KD</span>Bot
  </div>

  <div class="user-area" id="userArea">

    <img
      class="avatar"
      id="headerAvatar"
      src=""
      alt="Avatar"
    >

    <span
      class="username"
      id="headerUsername">
    </span>

    <button
      class="logout"
      id="logoutButton">
      تسجيل خروج
    </button>

  </div>

</header>

<main class="container">

  <!-- Login Page -->

  <section
    class="hero"
    id="loginSection">

    <h1>
      مرحباً بك في <span>KDBot</span>
    </h1>

    <p>
      لوحة تحكم متكاملة لإدارة بوت الديسكورد الخاص بك.
    </p>

    <a
      class="login"
      href="/login">
      تسجيل الدخول بواسطة Discord
    </a>

  </section>


  <!-- Dashboard -->

  <section
    class="dashboard"
    id="dashboardSection">

    <div class="welcome">

      <div class="profile">

        <img
          id="profileAvatar"
          src=""
          alt="Discord Avatar"
        >

        <div>

          <h2 id="welcomeName">
            أهلاً بك
          </h2>

          <p id="welcomeUsername">
            Discord User
          </p>

        </div>

      </div>

      <p>
        تم تسجيل الدخول بنجاح إلى لوحة تحكم KDBot.
      </p>

    </div>


    <div class="cards">

      <div class="card">

        <h3>
          حالة البوت
        </h3>

        <div
          class="value online"
          id="status">
          جاري الفحص...
        </div>

      </div>


      <div class="card">

        <h3>
          اسم البوت
        </h3>

        <div
          class="value"
          id="bot">
          KDBot
        </div>

      </div>


      <div class="card">

        <h3>
          الإصدار
        </h3>

        <div
          class="value"
          id="version">
          1.0.0
        </div>

      </div>

    </div>

  </section>

</main>

<footer>
  KDBot Dashboard © 2026
</footer>


<script>

async function loadUser() {

  try {

    const response =
      await fetch("/api/me");

    const data =
      await response.json();


    if (!data.loggedIn) {

      document.getElementById(
        "loginSection"
      ).style.display = "block";

      document.getElementById(
        "dashboardSection"
      ).style.display = "none";

      return;
    }


    const user = data.user;


    document.getElementById(
      "loginSection"
    ).style.display = "none";


    document.getElementById(
      "dashboardSection"
    ).style.display = "block";


    document.getElementById(
      "userArea"
    ).style.display = "flex";


    const displayName =
      user.global_name ||
      user.username ||
      "Discord User";


    document.getElementById(
      "welcomeName"
    ).textContent =
      `أهلاً ${displayName}`;


    document.getElementById(
      "welcomeUsername"
    ).textContent =
      `@${user.username}`;


    document.getElementById(
      "headerUsername"
    ).textContent =
      displayName;


    if (user.avatar) {

      const avatarUrl =
        `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png?size=128`;


      document.getElementById(
        "profileAvatar"
      ).src = avatarUrl;


      document.getElementById(
        "headerAvatar"
      ).src = avatarUrl;

    }

  } catch (error) {

    console.error(
      "User loading error:",
      error
    );

  }

}


async function loadStatus() {

  try {

    const response =
      await fetch("/api/status");

    const data =
      await response.json();


    document.getElementById(
      "status"
    ).textContent =
      data.online ? "Online" : "Offline";


    document.getElementById(
      "bot"
    ).textContent =
      data.bot || "KDBot";


    document.getElementById(
      "version"
    ).textContent =
      data.version || "1.0.0";

  } catch (error) {

    document.getElementById(
      "status"
    ).textContent =
      "Offline";

  }

}


document.getElementById(
  "logoutButton"
).addEventListener(
  "click",
  async () => {

    try {

      await fetch(
        "/logout",
        {
          method: "POST"
        }
      );

      window.location.href = "/";

    } catch (error) {

      console.error(
        "Logout error:",
        error
      );

    }

  }
);


loadUser();
loadStatus();

</script>

</body>
</html>
